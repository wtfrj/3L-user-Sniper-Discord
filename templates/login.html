<!DOCTYPE html>
<html>
<head>
    <title>Login - Username Checker</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            width: 360px;
            max-width: 90%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 300;
            color: #f0f6fc;
            text-align: center;
            margin-bottom: 8px;
        }
        .sub {
            text-align: center;
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.85rem;
            color: #b0b8c4;
        }
        .input-group input {
            width: 100%;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 1rem;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #238636;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn:hover { background: #2ea043; }
        .error {
            color: #f85149;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h1>🔍 Login</h1>
    <div class="sub">Enter your dashboard password</div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" required autofocus>
        </div>
        <button type="submit" class="btn">Login</button>
    </form>
</div>
</body>
</html>
